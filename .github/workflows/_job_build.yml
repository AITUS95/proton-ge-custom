name: _job_build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string

jobs:
  proton:
    name: Build ${{ inputs.name }}
    # Docker 29.4.2 on Ubuntu 26.04 breaks 32-bit socket calls.
    runs-on: ubuntu-24.04
    steps:
      - name: Cleanup disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_codeql: true
          remove_docker_images: true
          remove_swap: true
          remove_packages: |
            azure-cli google-cloud-cli google-chrome-stable firefox microsoft-edge-stable
            postgresql* mysql* php* temurin-* *llvm* clang* mono-devel powershell dotnet-sdk-*
          remove_folders: |
            /usr/share/swift /usr/share/miniconda /usr/local/lib/node_modules
            /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia*
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/share/az*
            /usr/local/.ghcup

      - name: Prepare host
        run: sudo apt update && sudo apt-get install -y ccache fontforge-nox

      - name: Restore cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-proton-${{ github.run_id }}
          restore-keys: |
            ccache-proton

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Ensure a version tag exists (forks without tags)
        run: git describe --tags >/dev/null 2>&1 || git tag custom-build

      - name: Patch
        run: |
          git submodule update --init --filter=tree:0 --recursive
          # apply proton-ge-custom patches
          ./patches/protonprep-valve-staging.sh || true
          # strip binaries at compile time to save space in the runner
          patch -Np1 -i ./.github/patches/0001-build-strip-binaries-early.patch
          mkdir ./build

      - name: Stage ONNX Runtime for Piper
        run: |
          # The GitHub release URL for this version returns 404.
          version=1.14.1
          package="$RUNNER_TEMP/onnxruntime.$version.nupkg"
          sdk_dir="$PWD/build/onnxruntime"
          curl --fail --show-error --silent --location --retry 3 \
            "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/$version/microsoft.ml.onnxruntime.$version.nupkg" \
            --output "$package"
          printf '%s  %s\n' 3a277421efce94b5f91f4a5dc8efc1add99b4c01f547279d81098ffb4fafbb6d "$package" | sha256sum --check

          mkdir -p "$sdk_dir/include" "$sdk_dir/lib"
          unzip -jq "$package" 'build/native/include/*.h' -d "$sdk_dir/include"
          unzip -jq "$package" 'runtimes/linux-x64/native/libonnxruntime.so' -d "$sdk_dir/lib"
          mv "$sdk_dir/lib/libonnxruntime.so" "$sdk_dir/lib/libonnxruntime.so.$version"
          ln -s "libonnxruntime.so.$version" "$sdk_dir/lib/libonnxruntime.so"

          python3 - <<'PYTHON'
          from pathlib import Path

          cmake = Path('piper/CMakeLists.txt')
          contents = cmake.read_text()
          install_prefix = '    CMAKE_ARGS -DCMAKE_INSTALL_PREFIX:PATH=${PIPER_PHONEMIZE_DIR}\n'
          if contents.count(install_prefix) != 1:
              raise SystemExit('Expected one Piper phonemize ExternalProject install argument')
          runtime = Path('build/onnxruntime').resolve()
          cmake.write_text(contents.replace(install_prefix, install_prefix + f'               "-DONNXRUNTIME_DIR:PATH={runtime}"\n'))
          PYTHON

      - name: Configure
        working-directory: ./build
        run: |
          ../configure.sh --build-name=${{ inputs.name }} --container-engine=docker

      - name: Check Steam Runtime SDK Unix sockets
        working-directory: ./build
        run: |
          docker version --format '{{.Server.Version}}'
          sdk_image=$(make --silent get-steamrt-image)
          docker run --rm -i --user "$(id -u):$(id -g)" --entrypoint /bin/bash "$sdk_image" -se <<'PROBE'
          probe_dir=$(mktemp -d)
          cat > "$probe_dir/socket.c" <<'C'
          #include <stdio.h>
          #include <sys/socket.h>
          #include <unistd.h>
          #if defined(__i386__)
          #include <linux/net.h>
          #include <sys/syscall.h>
          #endif

          int main(void)
          {
              int fd = socket(AF_UNIX, SOCK_STREAM, 0);
              if (fd == -1)
              {
                  perror("socket(AF_UNIX)");
                  return 1;
              }
              close(fd);
          #if defined(__i386__)
              unsigned long args[] = {AF_UNIX, SOCK_STREAM, 0};
              fd = syscall(SYS_socketcall, SYS_SOCKET, args);
              if (fd == -1)
              {
                  perror("socketcall(AF_UNIX)");
                  return 1;
              }
              close(fd);
          #endif
              return 0;
          }
          C
          for compiler in x86_64-linux-gnu-gcc i686-linux-gnu-gcc; do
            echo "Checking Unix sockets with $compiler"
            "$compiler" -static "$probe_dir/socket.c" -o "$probe_dir/socket-test"
            "$probe_dir/socket-test"
          done
          PROBE

      - name: Make ${{ inputs.name }}
        working-directory: ./build
        run: |
          make -j$(nproc) redist

      - name: Save cache
        id: ccache-save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Upload artifact ${{ inputs.name }}.tar.gz
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.name }}.tar.gz
          path: ./build/${{ inputs.name }}.tar.gz

      - name: Upload artifact ${{ inputs.name }}.sha512sum
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.name }}.sha512sum
          path: ./build/${{ inputs.name }}.sha512sum

